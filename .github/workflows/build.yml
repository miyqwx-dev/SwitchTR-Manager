name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        run: dkp-pacman -S --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-curl switch-jansson switch-zlib

      - name: Build NRO
        run: make -j$(nproc)

      - name: Package for HB App Store
        run: |
          mkdir -p out/switch/SwitchTR-Manager
          cp SwitchTR-Manager.nro out/switch/SwitchTR-Manager/
          cd out && zip -r ../SwitchTR-Manager.zip switch

      - uses: actions/upload-artifact@v4
        with:
          name: SwitchTR-Manager
          path: |
            SwitchTR-Manager.nro
            SwitchTR-Manager.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SwitchTR-Manager.nro
            SwitchTR-Manager.zip
